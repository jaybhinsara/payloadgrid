[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payloadgrid"
version = "0.1.0"
description = "Official server-side SDK for PayloadGrid"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["payloadgrid*"]
